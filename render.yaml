# =============================================================
# Render Blueprint · SMS Gateway · plan FREE
#
# Limitaciones del plan free de Render que condicionan este blueprint:
#   - No hay Background Workers en free → los workers BullMQ corren
#     dentro del mismo proceso del web service (ver src/index.ts).
#   - No existe `preDeployCommand` → las migraciones de Prisma se
#     ejecutan en el `buildCommand`.
#   - El web service se duerme tras ~15 min sin tráfico. Mientras
#     duerme, los workers tampoco procesan jobs. Para evitarlo,
#     configurar un keepalive externo (cron-job.org, UptimeRobot,
#     etc.) que pegue a /health cada 10 minutos.
#   - 512 MB RAM, 0.1 CPU, disco efímero.
#   - Sin static IPs (TextBee no puede whitelistear IP).
#   - 750 horas/mes de uptime gratis (alcanza para 1 servicio 24/7).
#
# Postgres y Redis NO se provisionan acá. Usás los tuyos:
#   - Supabase Postgres → DATABASE_URL (usar Connection Pooler en
#     puerto 6543 con ?pgbouncer=true&connection_limit=1, porque la
#     URL directa de Supabase es IPv6-only y Render no la resuelve).
#   - Upstash Redis     → REDIS_URL (rediss://default:<token>@host:port)
#
# Antes del primer deploy, en el dashboard del service pegá las
# env vars marcadas como `sync: false`:
#   - DATABASE_URL
#   - REDIS_URL
#   - JWT_PRIVATE_KEY_B64
#   - JWT_PUBLIC_KEY_B64
#   - MASTER_ENCRYPTION_KEY_B64
#   - ADMIN_BOOTSTRAP_TOKEN  (borrar del dashboard tras bootstrap)
#   - APP_BASE_URL           (https://<service>.onrender.com)
# =============================================================

services:
  # API + workers (todo en un solo proceso por límite de plan free)
  - type: web
    name: sms-gateway
    runtime: node
    plan: free
    region: oregon
    autoDeploy: true
    healthCheckPath: /health
    # Migraciones se corren acá porque preDeployCommand no existe en free.
    # Si la migración falla, el build falla y no se promueve la versión rota.
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build && npm ci --prefix web && npm run build --prefix web
    startCommand: node dist/index.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # PORT lo inyecta Render automáticamente — no lo seteamos acá.
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      # ⚠️ CLAVES HARDCODEADAS — solo para fines didácticos / demo.
      # En un despliegue real estas tres variables deben ser secretos
      # (sync: false) y NUNCA estar versionadas en git.
      - key: JWT_PRIVATE_KEY_B64
        value: 
      - key: JWT_PUBLIC_KEY_B64
        value: 
      - key: MASTER_ENCRYPTION_KEY_B64
        value: O7+foC32IPTKHaPif4W2wC4rvqSEyloHfbutr58khmg=
      - key: ADMIN_BOOTSTRAP_TOKEN
        value: 9ef85a6cf8ef505bbe56d08d0a57d6aae14da1d1cfb20342
      - key: JWT_ACCESS_TTL_SEC
        value: "900"
      - key: JWT_REFRESH_TTL_SEC
        value: "604800"
      - key: JWT_ISSUER
        value: sms-gateway
      - key: JWT_AUDIENCE
        value: sms-gateway-clients
      - key: TEXTBEE_BASE_URL
        value: https://api.textbee.dev/api/v1/gateway
      - key: TEXTBEE_TIMEOUT_MS
        value: "10000"
      - key: TEXTBEE_MAX_RETRIES
        value: "3"
      - key: OTP_LENGTH
        value: "6"
      - key: OTP_TTL_SEC
        value: "300"
      - key: OTP_MAX_ATTEMPTS
        value: "5"
      - key: OTP_MESSAGE_TEMPLATE
        value: "Tu codigo es {{code}}. Expira en {{minutes}} min."
      - key: RATE_LIMIT_IP_MAX
        value: "10"
      - key: RATE_LIMIT_IP_WINDOW_SEC
        value: "3600"
      - key: RATE_LIMIT_PHONE_DAILY_MAX
        value: "5"
      - key: RATE_LIMIT_PHONE_COOLDOWN_SEC
        value: "60"
      - key: CORS_ORIGINS
        value: ""
      - key: DEFAULT_PHONE_REGION
        value: AR
      # Workers bajados para no comer la RAM de 512 MB junto con la API.
      - key: WORKER_CONCURRENCY
        value: "2"
      - key: WORKER_MAX_RETRIES
        value: "3"
      - key: WORKER_BACKOFF_MS
        value: "2000"
      - key: CIRCUIT_FAILURE_THRESHOLD
        value: "5"
      - key: CIRCUIT_RESET_TIMEOUT_MS
        value: "30000"
      - key: METRICS_ENABLED
        value: "true"
      - key: METRICS_IP_ALLOWLIST
        value: 127.0.0.1,::1
