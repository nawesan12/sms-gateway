# =============================================================
# Render Blueprint · SMS Gateway (sin Docker, runtime Node)
#
# Postgres y Redis NO se provisionan acá. Usás los tuyos:
#   - Supabase Postgres → DATABASE_URL
#   - Upstash Redis     → REDIS_URL
#
# Antes del primer deploy, en el dashboard de cada service
# pegá las env vars marcadas como `sync: false`:
#   - DATABASE_URL
#   - REDIS_URL
#   - JWT_PRIVATE_KEY_B64
#   - JWT_PUBLIC_KEY_B64
#   - MASTER_ENCRYPTION_KEY_B64
#   - ADMIN_BOOTSTRAP_TOKEN
#   - APP_BASE_URL
#
# Notas:
# - DATABASE_URL de Supabase: usá la URL "Connection string" que
#   termina en ?sslmode=require (no hace falta pooler).
# - REDIS_URL de Upstash: viene como rediss://default:<token>@host:port
#   (TLS, ioredis lo maneja solo).
# =============================================================

services:
  # ----------------------- API web ------------------------
  - type: web
    name: sms-gateway-api
    runtime: node
    plan: starter
    region: oregon
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: npm ci && npx prisma generate && npm run build && npm ci --prefix web && npm run build --prefix web
    preDeployCommand: npx prisma migrate deploy
    startCommand: node dist/index.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: PORT
        value: "3000"
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_PRIVATE_KEY_B64
        sync: false
      - key: JWT_PUBLIC_KEY_B64
        sync: false
      - key: MASTER_ENCRYPTION_KEY_B64
        sync: false
      - key: ADMIN_BOOTSTRAP_TOKEN
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: JWT_ACCESS_TTL_SEC
        value: "900"
      - key: JWT_REFRESH_TTL_SEC
        value: "604800"
      - key: JWT_ISSUER
        value: sms-gateway
      - key: JWT_AUDIENCE
        value: sms-gateway-clients
      - key: TEXTBEE_BASE_URL
        value: https://api.textbee.dev/api/v1/gateway
      - key: TEXTBEE_TIMEOUT_MS
        value: "10000"
      - key: TEXTBEE_MAX_RETRIES
        value: "3"
      - key: OTP_LENGTH
        value: "6"
      - key: OTP_TTL_SEC
        value: "300"
      - key: OTP_MAX_ATTEMPTS
        value: "5"
      - key: OTP_MESSAGE_TEMPLATE
        value: "Tu codigo es {{code}}. Expira en {{minutes}} min."
      - key: RATE_LIMIT_IP_MAX
        value: "10"
      - key: RATE_LIMIT_IP_WINDOW_SEC
        value: "3600"
      - key: RATE_LIMIT_PHONE_DAILY_MAX
        value: "5"
      - key: RATE_LIMIT_PHONE_COOLDOWN_SEC
        value: "60"
      - key: CORS_ORIGINS
        value: ""
      - key: DEFAULT_PHONE_REGION
        value: AR
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: WORKER_MAX_RETRIES
        value: "3"
      - key: WORKER_BACKOFF_MS
        value: "2000"
      - key: CIRCUIT_FAILURE_THRESHOLD
        value: "5"
      - key: CIRCUIT_RESET_TIMEOUT_MS
        value: "30000"
      - key: METRICS_ENABLED
        value: "true"
      - key: METRICS_IP_ALLOWLIST
        value: 127.0.0.1,::1

  # ----------------------- Worker -------------------------
  - type: worker
    name: sms-gateway-worker
    runtime: node
    plan: starter
    region: oregon
    autoDeploy: true
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: node dist/worker.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: MASTER_ENCRYPTION_KEY_B64
        sync: false
      - key: TEXTBEE_BASE_URL
        value: https://api.textbee.dev/api/v1/gateway
      - key: TEXTBEE_TIMEOUT_MS
        value: "10000"
      - key: TEXTBEE_MAX_RETRIES
        value: "3"
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: WORKER_MAX_RETRIES
        value: "3"
      - key: WORKER_BACKOFF_MS
        value: "2000"
      - key: CIRCUIT_FAILURE_THRESHOLD
        value: "5"
      - key: CIRCUIT_RESET_TIMEOUT_MS
        value: "30000"
      - key: DEFAULT_PHONE_REGION
        value: AR
